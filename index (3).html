<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listini</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2430; --muted: #6b7686; --line: #e3e7ee;
    --grid: #aab3c0; --thead: #cfd5de; --accent: #1f5fbf; --accent-soft: #e8f0fc; --warn: #b4531a; --warn-soft: #fcefe3; --ok: #1d7a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #98a2b3; --line: #2c323c;
            --grid: #4b5565; --thead: #343b48; --accent: #6aa3f5; --accent-soft: #1f2a3d; --warn: #f0a46b; --warn-soft: #33261a; --ok: #62c28e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=search], select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .btn { padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .err { color: #c0392b; margin-top: 12px; min-height: 18px; }
  .pill { margin: 0; }

  /* App */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .logos { display: flex; align-items: center; gap: 18px; justify-self: start; background: #fff; border-radius: 6px; padding: 4px 10px; }
  header .logo { height: 46px; width: auto; display: block; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .1em; text-align: center; }
  .auth { justify-self: end; display: flex; align-items: center; gap: 8px; position: relative; }
  .auth input { width: 170px; padding: 6px 9px; }
  .auth .btn { padding: 6px 12px; }
  .auth .err { position: absolute; right: 0; top: 100%; margin: 2px 0 0; min-height: 0; font-size: 12px; white-space: nowrap; }
  .who { color: var(--muted); font-size: 13px; }
  .role { background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
  main { padding: 16px 20px 40px; }
  .intro { padding: 60px 20px; text-align: center; color: var(--muted); }
  .filters { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 10px; }
  .checks { display: flex; gap: 16px; margin: 4px 0 12px; color: var(--muted); }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; cursor: pointer; }
  .tablewrap { background: var(--panel); border: 1px solid var(--grid); border-radius: 6px; overflow: auto; max-height: calc(100vh - 290px); min-height: 260px; }
  #tbl { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  th, td { padding: 8px 12px; text-align: left; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--panel); }
  thead th { font-size: 12px; color: var(--text); font-weight: 700; background: var(--thead); position: sticky; top: 0; z-index: 3; user-select: none; }
  thead tr.frow th { top: var(--h1, 36px); background: var(--panel); font-weight: 400; padding: 4px 8px 6px; z-index: 3; box-shadow: 0 1px 0 var(--grid); }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; box-shadow: 2px 0 0 var(--grid); font-weight: 600; }
  thead th:first-child { z-index: 5; }
  th.sortable .lbl { cursor: pointer; }
  th .arrow { color: var(--accent); margin-left: 4px; }
  th .rs { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; }
  th .rs:hover, th .rs.on { background: var(--accent); opacity: .35; }
  tr.frow input, tr.frow select { padding: 5px 7px; font-size: 13px; }
  .toolbar { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin: 0 0 8px; color: var(--muted); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--accent-soft); }
  tr.obs td { color: var(--muted); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; }
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; color: var(--muted); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }

  /* Scheda articolo */
  #veil { position: fixed; inset: 0; background: rgba(15,20,30,.55); z-index: 40; }
  #drawer { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1100px, 96vw); max-height: 92vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--grid); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 0; }
  .mhead { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .mhead .tt { flex: 1; min-width: 0; }
  .mhead h2 { margin: 0; font-size: 20px; }
  .mhead .sub { color: var(--muted); margin-top: 2px; }
  .mnav { display: flex; gap: 6px; align-items: center; }
  .mnav .btn { padding: 6px 12px; font-size: 16px; line-height: 1; }
  .mnav .pos { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .mbody { padding: 16px 20px 22px; display: grid; gap: 16px; }
  .box { border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .box > h3 { margin: 0; padding: 7px 14px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
  .hbtn { background: rgba(255,255,255,.8); border: 1px solid rgba(0,0,0,.2); border-radius: 6px; padding: 2px 10px; font-size: 12px; cursor: pointer; text-transform: none; letter-spacing: 0; color: #1d2430; }
  .formgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }
  .two .formgrid { grid-template-columns: 1fr 1fr; }
  .f { margin: 0; display: block; } .f > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .box.acq .f > span, .box.ven .f > span { color: #5b6574; }
  .f.wide { grid-column: 1 / -1; } .f.ck { display: flex; align-items: center; gap: 8px; padding-top: 18px; }
  .f.ck > span { margin: 0; }
  .formact { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .box.acq .hint, .box.ven .hint { color: #5b6574; }
  @media (max-width: 860px) { .formgrid, .two .formgrid { grid-template-columns: 1fr; } }
  .box > .in { padding: 12px 14px 14px; }
  .box.ident > h3 { background: var(--thead); color: var(--text); }
  .box.acq { border-color: #f0993a; background: #fef3e2; }
  .box.acq > h3 { background: #f7941d; color: #1d2430; }
  .box.ven { border-color: #86b83a; background: #eef6df; }
  .box.ven > h3 { background: #8cc63f; color: #1d2430; }
  .box.acq, .box.ven { color: #1d2430; }
  .box.acq dt, .box.ven dt, .box.acq .who, .box.ven .who { color: #5b6574; }
  @media (prefers-color-scheme: dark) {
    .box.acq { background: #3a2a14; border-color: #b9701c; color: var(--text); } .box.acq > h3 { background: #c8741a; color: #fff; }
    .box.ven { background: #26331a; border-color: #5f8a28; color: var(--text); } .box.ven > h3 { background: #5f8a28; color: #fff; }
    .box.acq dt, .box.ven dt, .box.acq .who, .box.ven .who { color: var(--muted); }
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .identgrid { display: grid; grid-template-columns: 1fr 240px; gap: 18px; }
  .identcols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
  .imgbox { border: 2px dashed var(--grid); border-radius: 10px; min-height: 200px; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
  .imgcol { display: flex; flex-direction: column; gap: 8px; }
  .imgbox.has { border-style: solid; padding: 6px; }
  .imgbox img { max-width: 100%; max-height: 230px; object-fit: contain; border-radius: 6px; }
  .imgact { display: flex; gap: 6px; flex-wrap: wrap; } .imgact .btn { padding: 5px 10px; font-size: 12px; }
  .mini { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
  .box.acq .mini, .box.ven .mini { color: #5b6574; }
  .big { font-size: 22px; font-weight: 700; }
  @media (max-width: 860px) { .two, .identgrid, .identcols { grid-template-columns: 1fr; } }
  .sec { margin-top: 18px; }
  .sec h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  .editbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .editbox h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
  .editbox label.ck { display: inline-flex; align-items: center; gap: 6px; margin: 3px 14px 3px 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0 0 0 8px; font-size: 12px; }
  .tag { display: inline-block; border: 1px solid rgba(0,0,0,.07); background: #ccc; color: #1d2430; padding: 1px 9px; border-radius: 999px; font-size: 12px; line-height: 1.4; margin-right: 4px; vertical-align: middle; white-space: nowrap; }
  .tag.pick { cursor: pointer; opacity: .5; user-select: none; }
  .tag.pick.sel { opacity: 1; box-shadow: 0 0 0 2px var(--text); }
  #seriePanel { position: fixed; z-index: 30; width: 420px; max-width: calc(100vw - 16px); max-height: 60vh; overflow: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--grid); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #seriePanel .ph { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  #seriePanel .tags { display: flex; flex-wrap: wrap; gap: 8px 4px; }
  #serieToggle { width: 100%; padding: 5px 7px; font-size: 13px; text-align: left; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 999px; font-size: 12px; }
  .hist th, .hist td { background: transparent !important; box-shadow: none !important; position: static !important; font-weight: 400; border-right: none; color: inherit; }
  .hist th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--grid); }
  .hist { border-collapse: collapse; }
  .hist td, .hist th { padding: 5px 8px; font-size: 13px; }
  @media (max-width: 760px) { dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
</style>
</head>

<script>
const SUPABASE_URL = 'https://krsijkhyewrdyrhrjtva.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VJxmkx41yElltIHnr4YgPw_kXgQ8IZw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PAGE = 50;
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = (v) => v === null || v === undefined ? '' : Number(v).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (v, d = 4) => v === null || v === undefined ? '' : Number(v).toLocaleString('it-IT', { maximumFractionDigits: d });
const pct = (v) => v === null || v === undefined ? '' : (Number(v) * 100).toLocaleString('it-IT', { maximumFractionDigits: 3 }) + ' %';
const dt = (v) => v ? new Date(v).toLocaleDateString('it-IT') : '';

let page = 0, total = 0, timer = null, seq = 0;

/* ---------- accesso ---------- */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Email o password non corretti.'; return; }
  $('password').value = '';
  start();
});
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('loginForm').classList.remove('hidden'); $('userBox').classList.add('hidden'); $('intro').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  $('loginForm').classList.add('hidden'); $('userBox').classList.remove('hidden'); $('intro').classList.add('hidden'); $('app').classList.remove('hidden');
  $('whoEmail').textContent = session.user.email;
  const { data: prof } = await sb.from('profili').select('ruolo').eq('user_id', session.user.id).maybeSingle();
  isAdmin = prof?.ruolo === 'admin';
  $('whoRole').textContent = isAdmin ? 'Admin' : 'Sola lettura';
  await loadLists();
  await load();
}

function applyWidths() {
  $('cols').innerHTML = widths.map(w => `<col style="width:${w}px">`).join('');
  $('tbl').style.width = widths.reduce((a, b) => a + b, 0) + 'px';
}
function saveWidths() { try { localStorage.setItem('listini_w3', JSON.stringify(widths)); } catch (e) {} }

window.addEventListener('resize', setHeadH);
function buildHead() {
  const arrow = (c) => sort.k === c.k ? `<span class="arrow">${sort.asc ? '▲' : '▼'}</span>` : '';
  const h1 = COLS.map((c, i) => `<th class="${c.nosort ? '' : 'sortable '}${c.num ? 'num' : ''}" data-i="${i}"><span class="lbl">${esc(c.label)}</span>${c.nosort ? '' : arrow(c)}<span class="rs" data-i="${i}"></span></th>`).join('');

async function load() {
  const my = ++seq;
  let q = sb.from('v_articoli_lista')
    
    .select('id,serie_ids,codice,descrizione,famiglia,fornitore,codice_articolo_fornitore,unita_misura,lotto_economico,lotto_minimo_vendita,unita_per_confezione,prezzo_acquisto,sconto_unico,prezzo_vendita,obsoleto', { count: 'exact' })
    .order(sort.k, { ascending: sort.asc, nullsFirst: false });
  if (sort.k !== 'codice') q = q.order('codice');
  const text = $('q').value.trim().replace(/[,()%*\\]/g, ' ');
  if (text) q = q.or(`codice.ilike.%${text}%,descrizione.ilike.%${text}%,codice_articolo_fornitore.ilike.%${text}%`);
  ['codice', 'descrizione', 'codice_articolo_fornitore'].forEach(k => { const v = (colF[k] || '').trim().replace(/[%*]/g, ''); if (v) q = q.ilike(k, `%${v}%`); });
  if (colF.fornitore) q = q.eq('fornitore', colF.fornitore);
  if (colF.famiglia) q = q.eq('famiglia', colF.famiglia);
  if (serieSel.size) q = q.overlaps('serie_ids', [...serieSel]);
  if (colF.unita_misura) q = q.eq('unita_misura', colF.unita_misura);
  if (!$('cObs').checked) q = q.eq('obsoleto', false);
  if ($('cNoPrice').checked) q = q.is('prezzo_acquisto', null);
  q = q.range(page * PAGE, page * PAGE + PAGE - 1);
  const { data, count, error } = await q;
  if (my !== seq) return;
  if (error) { $('rows').innerHTML = ''; $('empty').textContent = 'Errore nel caricamento: ' + error.message; $('empty').classList.remove('hidden'); return; }
  total = count || 0;
  listIds = (data || []).map(r => r.id);
  $('empty').textContent = 'Nessun articolo trovato.';
  $('empty').classList.toggle('hidden', total > 0);
  const cell = (c, r) => {
    if (c.k === 'codice') return esc(r.codice) + (r.obsoleto ? '<span class="badge">obsoleto</span>' : '');
    if (c.k === 'prezzo_acquisto' || c.k === 'prezzo_vendita') return eur(r[c.k]);
    if (c.k === 'sconto_unico') return Number(r.sconto_unico) > 0 ? pct(r.sconto_unico) : '';
    if (['lotto_economico', 'lotto_minimo_vendita', 'unita_per_confezione'].includes(c.k)) return num(r[c.k], 3);
    if (c.k === 'serie') return (r.serie_ids || []).map(serieById).filter(Boolean).map(x => tag(x)).join('');
    return esc(r[c.k]);
  };
  $('rows').innerHTML = (data || []).map(r => `<tr data-id="${r.id}" class="${r.obsoleto ? 'obs' : ''}">` +
    COLS.map(c => `<td class="${c.num ? 'num' : ''}" ${c.k === 'descrizione' ? `title="${esc(r.descrizione)}"` : c.k === 'serie' ? `title="${esc((r.serie_ids || []).map(serieById).filter(Boolean).map(x => x.nome).join(', '))}"` : ''}>${cell(c, r)}</td>`).join('') + '</tr>').join('');
  const from = total ? page * PAGE + 1 : 0, to = Math.min(total, (page + 1) * PAGE);
  const label = `${from}–${to} di ${total.toLocaleString('it-IT')} articoli`;
  $('count').textContent = label; $('count2').textContent = label;
  ['prev', 'prev2'].forEach(id => $(id).disabled = page === 0);
  ['next', 'next2'].forEach(id => $(id).disabled = to >= total);
}

async function resizeImage(file, max = 900) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}
async function uploadImage(file) {
  const err = (m) => { const e = $('imgErr'); if (e) e.textContent = m; };
  try {
    err('Caricamento…');
    const blob = await resizeImage(file);
    const path = `${currentId}.jpg`;
    const up = await sb.storage.from(BUCKET).upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
    if (up.error) return err('Errore: ' + up.error.message);
    const u = await sb.from('articoli').update({ immagine: path }).eq('id', currentId);
    if (u.error) return err('Errore: ' + u.error.message);
    await openArticle(currentId, true);
  } catch (e) { err('Immagine non valida o non leggibile.'); }
}
async function removeImage() {
  if (!curImg) return;
  await sb.storage.from(BUCKET).remove([curImg]);
  await sb.from('articoli').update({ immagine: null }).eq('id', currentId);
  await openArticle(currentId, true);

  currentId = Number(id);
  if (!keepEdit) editing = null;
  $('veil').classList.remove('hidden'); $('drawer').classList.remove('hidden');
  if (!$('drawerBody').firstChild) $('drawerBody').innerHTML = '<p class="who" style="padding:20px">Caricamento…</p>';
  const [art, hist, sist, img] = await Promise.all([
    sb.from('v_articoli').select('*').eq('id', id).single(),
    sb.from('storico_prezzi').select('data_modifica,campo,valore_precedente,valore_nuovo').eq('articolo_id', id).order('data_modifica', { ascending: false }).limit(100),
    sb.from('articoli_sistemi').select('sistema_id, sistemi(id,nome,gruppo)').eq('articolo_id', id),
    sb.from('articoli').select('immagine').eq('id', id).single()
  ]);
  if (Number(id) !== currentId) return;
  curImg = img.data?.immagine || null;
  if (art.error) { $('drawerBody').innerHTML = '<p class="err" style="padding:20px">Errore: ' + esc(art.error.message) + '</p>'; return; }
  curArt = art.data; curHist = hist.data || [];
  currentSist = (sist.data || []).map(x => x.sistemi).filter(Boolean);
  renderModal();
}

async function startEdit(sec) {
  if (!isAdmin) return;
  if (sec === 'ident' || sec === 'acq') await ensureLookups();
  editing = sec; renderModal();
}

async function saveSection(sec) {
  const box = document.querySelector(`.box[data-sec="${sec}"]`), a = curArt, payload = {};
  const err = (m) => { $('saveErr').textContent = m; };
  let bad = null;
  box.querySelectorAll('[data-k]').forEach(el => {
    if (bad) return;
    const k = el.dataset.k, t = el.dataset.t; let v;
    if (t === 'bool') v = el.checked;
    else {
      const raw = el.value.trim();
      if (raw === '') v = t === 'pct0' ? 0 : null;
      else if (t === 'text') v = raw;
      else if (t === 'id') v = Number(raw);
      else {
        const n = Number(raw.replace(',', '.'));
        if (!isFinite(n)) { bad = 'Valore non valido: ' + (el.closest('label')?.querySelector('span')?.textContent || k); return; }
        v = (t === 'pct' || t === 'pct0') ? Math.round(n * 1e4) / 1e6 : n;
      }
    }
    const old = a[k];
    const same = v === null ? (old === null || old === undefined || old === '') : t === 'text' ? String(old ?? '') === v : t === 'bool' ? !!old === v : Number(old) === v;
    if (!same) payload[k] = v;
  });
  if (bad) return err(bad);
  if (sec === 'ident' && 'descrizione' in payload && !payload.descrizione) return err('La descrizione non può essere vuota.');
  if (!Object.keys(payload).length) { editing = null; renderModal(); return; }
  if ('prezzo_acquisto' in payload) payload.data_ultima_variazione = new Date().toISOString().slice(0, 10);
  box.querySelectorAll('.btn').forEach(b => b.disabled = true);
  const up = await sb.from('articoli').update(payload).eq('id', currentId);
  if (up.error) { box.querySelectorAll('.btn').forEach(b => b.disabled = false); return err('Errore: ' + up.error.message); }
  const toCalc = sec === 'acq' || (sec === 'ven' && !('prezzo_vendita' in payload));
  if (toCalc) await sb.rpc('aggiorna_prezzo_vendita', { p_articolo: currentId });
  editing = null;
  await openArticle(currentId); load();
}

async function navArticle(dir) {
  const idx = listIds.indexOf(currentId);
  if (idx < 0) return;
  const j = idx + dir;
  if (j >= 0 && j < listIds.length) return openArticle(listIds[j]);
  const np = page + dir;
  if (np < 0 || np * PAGE >= total) return;
  page = np; await load();
  if (listIds.length) openArticle(dir > 0 ? listIds[0] : listIds[listIds.length - 1]);
}

/* ---------- serie (etichette colorate) ---------- */
function renderCompat() {
  const mine = currentSist.filter(x => x.gruppo === 'sottofamiglia').map(x => serieById(x.id) || x);
  $('compat').innerHTML = `<h3>Serie${isAdmin ? '<button class="link" data-act="edit-compat">Modifica</button>' : ''}</h3>
    <div>${mine.map(x => tag(x)).join('') || '<span class="who">—</span>'}</div>`;
}

function editCompat() {
  const have = new Set(currentSist.map(x => x.id));
  $('compat').innerHTML = `<h3>Modifica serie</h3><div class="editbox">
    <div id="pickBox">${serieAll.map(x => tag(x, 'pick' + (have.has(x.id) ? ' sel' : ''))).join('')}</div>
    <h4>Aggiungi una nuova serie (non ancora in elenco)</h4>
    <div class="row"><input type="text" id="newSist" placeholder="es. Eku Nuova Linea"><input type="color" id="newColor" value="#dbe8f5" title="Colore"></div>
    <div class="row"><button class="btn" data-act="save-compat">Salva</button><button class="btn" data-act="cancel-compat">Annulla</button><span class="err" id="compatErr"></span></div></div>`;
  $('pickBox').addEventListener('click', (e) => { const t = e.target.closest('.tag.pick'); if (t) t.classList.toggle('sel'); });
}

async function saveCompat() {
  const btns = document.querySelectorAll('#compat .btn'); btns.forEach(b => b.disabled = true);
  const err = (m) => { $('compatErr').textContent = m; btns.forEach(b => b.disabled = false); };
  const have = new Set(currentSist.filter(x => x.gruppo === 'sottofamiglia').map(x => x.id));
  const want = new Set([...document.querySelectorAll('#pickBox .tag.sel')].map(i => Number(i.dataset.sid)));
  const nuovo = $('newSist').value.trim().replace(/\s+/g, ' ');
  if (nuovo) {
    const esiste = serieAll.find(x => x.nome.toLowerCase() === nuovo.toLowerCase());
    if (esiste) want.add(esiste.id);
    else {
      const ins = await sb.from('sistemi').insert({ nome: nuovo, gruppo: 'sottofamiglia', colore: $('newColor').value.toUpperCase() }).select('id,nome,colore').single();
      if (ins.error) return err('Errore: ' + ins.error.message);
      serieAll.push(ins.data); serieAll.sort((a, b) => a.nome.localeCompare(b.nome)); want.add(ins.data.id); renderSerieBar();
    }
  }
  const toDel = [...have].filter(x => !want.has(x)), toAdd = [...want].filter(x => !have.has(x));
  if (toDel.length) { const d = await sb.from('articoli_sistemi').delete().eq('articolo_id', currentId).in('sistema_id', toDel); if (d.error) return err('Errore: ' + d.error.message); }
  if (toAdd.length) { const i = await sb.from('articoli_sistemi').insert(toAdd.map(sid => ({ articolo_id: Number(currentId), sistema_id: sid }))); if (i.error) return err('Errore: ' + i.error.message); }
  await openArticle(currentId, true); load();
}

$('drawer').addEventListener('click', (e) => {
  const act = e.target.dataset?.act; if (!act) return;
  if (act === 'edit-compat') editCompat();
  if (act === 'save-compat') saveCompat();
  if (act === 'cancel-compat') renderCompat();
});
function closeDrawer() { $('veil').classList.add('hidden'); $('drawer').classList.add('hidden'); }
$('drawer').addEventListener('click', (e) => {
  if (e.target.closest('#closeDrawer')) closeDrawer();
  const n = e.target.closest('[data-nav]'); if (n) navArticle(Number(n.dataset.nav));
  const ed = e.target.closest('[data-edit]'); if (ed) startEdit(ed.dataset.edit);
  const sv = e.target.closest('[data-save]'); if (sv) saveSection(sv.dataset.save);
  if (e.target.closest('[data-cancel]')) { editing = null; renderModal(); }
  const im = e.target.closest('[data-img]'); if (im) { im.dataset.img === 'pick' ? $('imgFile').click() : removeImage(); }
});
$('veil').addEventListener('click', closeDrawer);
$('drawer').addEventListener('change', (e) => { if (e.target.id === 'imgFile' && e.target.files[0]) uploadImage(e.target.files[0]); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
  if ($('drawer').classList.contains('hidden') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
  if (editing) return;
  if (e.key === 'ArrowLeft') navArticle(-1);
  if (e.key === 'ArrowRight') navArticle(1);
});

start();
</script>
