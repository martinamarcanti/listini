$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Email o password non corretti.'; return; }
  $('password').value = '';
  start();
});
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('loginForm').classList.remove('hidden'); $('userBox').classList.add('hidden'); $('intro').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  $('loginForm').classList.add('hidden'); $('userBox').classList.remove('hidden'); $('intro').classList.add('hidden'); $('app').classList.remove('hidden');
  $('whoEmail').textContent = session.user.email;
  const { data: prof } = await sb.from('profili').select('ruolo').eq('user_id', session.user.id).maybeSingle();

  $('newArt').classList.toggle('hidden', !isAdmin); $('bulkImg').classList.toggle('hidden', !isAdmin); $('impBtn').classList.toggle('hidden', !isAdmin);
  $('whoRole').textContent = isAdmin ? 'Admin' : 'Sola lettura';
  await loadLists();
  await load();
}

    place(); $('fpTxt').focus(); return;
  }
  if (c.filter === 'range') {
    const cur = colR[c.k] || {};
    const sc = c.k === 'sconto_unico';
    const show = (v) => v == null ? '' : (sc ? Math.round(v * 1e6) / 1e4 : v);
    pn.innerHTML = sortHtml + `<div class="rg"><span>Da${sc ? ' (%)' : ''}</span><input type="number" step="any" id="fpMin" value="${show(cur.min)}"><span>A${sc ? ' (%)' : ''}</span><input type="number" step="any" id="fpMax" value="${show(cur.max)}"></div><div class="btns"><button class="btn clr" type="button" data-a="clr">Cancella filtro</button><button class="btn" type="button" data-a="ok">OK</button></div>`;
    place(); $('fpMin').focus(); return;
  }
  pn.innerHTML = sortHtml + '<div class="lst">Caricamento…</div>';
  place();
  const me = fp;
  if (c.filter === 'serie') {
    me.items = serieAll.map(x => ({ key: String(x.id), label: x.nome, serie: x })).concat([{ key: '0', label: '(Senza serie)' }]);
    me.draft = new Set(serieSel.size ? [...serieSel].map(String) : me.items.map(x => x.key));
  } else {
    const { data, error } = await sb.rpc('valori_distinti', { p_col: c.k });
    if (fp !== me) return;
    if (error) { pn.innerHTML = `<div class="lst">Errore: ${esc(error.message)}</div>`; return; }
    me.items = (data || []).map(d => {
      const key = d.valore == null ? '' : String(d.valore);
      return { key, n: d.n, label: key === '' ? '(Vuote)' : (c.num ? num(d.valore, 3) : d.valore) };
    });
    me.draft = new Set(colSel[c.k] ? colSel[c.k] : me.items.map(x => x.key));
  }
  pn.innerHTML = sortHtml + `<input type="search" id="fpQ" placeholder="Cerca…"><div class="lst" id="fpL"></div><div class="btns"><button class="btn clr" type="button" data-a="clr">Cancella filtro</button><button class="btn" type="button" data-a="ok" id="fpOk">OK</button></div>`;
  fpList(); place(); $('fpQ').focus();
}
function fpVisible() { const t = fp.q.toLowerCase(); return fp.items.filter(x => !t || String(x.label).toLowerCase().includes(t)); }
function fpList() {
  const vis = fpVisible();
  const all = vis.length && vis.every(x => fp.draft.has(x.key));
  $('fpL').innerHTML = `<label><input type="checkbox" data-all="1" ${all ? 'checked' : ''}> <b>(Seleziona tutto)</b></label>` +

function fpApply() {
  const c = fp.c;

/* ---------- elenco ---------- */
function applyFilters(q) {
  const text = $('q').value.trim().replace(/[,()%*\\]/g, ' ');
  if (text) q = q.or(`codice.ilike.%${text}%,descrizione.ilike.%${text}%,codice_articolo_fornitore.ilike.%${text}%`);
  ['codice', 'descrizione', 'codice_articolo_fornitore'].forEach(k => { const v = (colF[k] || '').trim().replace(/[%*]/g, ''); if (v) q = q.ilike(k, `%${v}%`); });
  const qt = (v) => '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  Object.keys(colSel).forEach(k => {
    const keys = [...colSel[k]], hasNull = keys.includes(''), vals = keys.filter(x => x !== '');
    if (!vals.length) q = q.is(k, null);
    else if (!hasNull) q = q.in(k, vals);
    else q = q.or(`${k}.in.(${vals.map(qt).join(',')}),${k}.is.null`);
  });
  Object.keys(colR).forEach(k => { const r = colR[k]; if (r.min != null) q = q.gte(k, r.min); if (r.max != null) q = q.lte(k, r.max); });
  if (serieSel.size) {
    const ids = [...serieSel].filter(x => x > 0), none = serieSel.has(0);
    if (ids.length && none) q = q.or(`serie_ids.ov.{${ids.join(',')}},serie_ids.eq.{}`);
    else if (ids.length) q = q.overlaps('serie_ids', ids);
    else q = q.eq('serie_ids', '{}');
  }
  if (obsMode === 'no') q = q.eq('obsoleto', false); else if (obsMode === 'si') q = q.eq('obsoleto', true);
  if ($('cNoPrice').checked) q = q.is('prezzo_acquisto', null);
  return q;
}
async function load() {
  const my = ++seq;
  let q = sb.from('v_articoli_lista')
    
    .select('id,serie_ids,codice,descrizione,famiglia,fornitore,codice_articolo_fornitore,unita_misura,lotto_economico,lotto_minimo_vendita,unita_per_confezione,prezzo_acquisto,sconto_unico,prezzo_vendita,obsoleto', { count: 'exact' })
    .order(sort.k, { ascending: sort.asc, nullsFirst: false });
  if (sort.k !== 'codice') q = q.order('codice');
  q = applyFilters(q);
  q = q.range(page * PAGE, page * PAGE + PAGE - 1);
  const { data, count, error } = await q;
  if (my !== seq) return;
  if (error) { $('rows').innerHTML = ''; $('empty').textContent = 'Errore nel caricamento: ' + error.message; $('empty').classList.remove('hidden'); return; }
  total = count || 0;
  listIds = (data || []).map(r => r.id);
  renderSel();
  $('empty').textContent = 'Nessun articolo trovato.';
  $('empty').classList.toggle('hidden', total > 0);
  const cell = (c, r) => {
    if (c.k === 'codice') return (isAdmin ? `<input type="checkbox" class="rc" data-id="${r.id}" ${selIds.has(r.id) ? 'checked' : ''}>` : '') + esc(r.codice) + (r.obsoleto ? '<span class="badge">obsoleto</span>' : '');
    if (c.k === 'prezzo_acquisto' || c.k === 'prezzo_vendita') return eur(r[c.k]);
    if (c.k === 'sconto_unico') return Number(r.sconto_unico) > 0 ? pct(r.sconto_unico) : '';
    if (['lotto_economico', 'lotto_minimo_vendita', 'unita_per_confezione'].includes(c.k)) return num(r[c.k], 3);
    if (c.k === 'serie') return (r.serie_ids || []).map(serieById).filter(Boolean).map(x => tag(x)).join('');
    return esc(r[c.k]);
  };
  $('rows').innerHTML = (data || []).map(r => `<tr data-id="${r.id}" class="${r.obsoleto ? 'obs' : ''}${selIds.has(r.id) ? ' sel' : ''}">` +
    COLS.map(c => `<td class="${c.num ? 'num ' : ''}g-${c.g}" ${c.k === 'descrizione' ? `title="${esc(r.descrizione)}"` : c.k === 'serie' ? `title="${esc((r.serie_ids || []).map(serieById).filter(Boolean).map(x => x.nome).join(', '))}"` : ''}>${cell(c, r)}</td>`).join('') + '</tr>').join('');
  const from = total ? page * PAGE + 1 : 0, to = Math.min(total, (page + 1) * PAGE);
  const label = `${from}–${to} di ${total.toLocaleString('it-IT')} articoli`;
  $('count').textContent = label; $('count2').textContent = label;
  ['prev', 'prev2'].forEach(id => $(id).disabled = page === 0);
  ['next', 'next2'].forEach(id => $(id).disabled = to >= total);
}

/* ---------- finestra di conferma / avviso ---------- */
function ask({ title = 'Conferma', text = '', list = [], ok = 'Procedi', cancel = 'Annulla', warn = false } = {}) {
  return new Promise((resolve) => {
    const v = document.createElement('div'); v.id = 'dlgVeil';
    v.innerHTML = `<div id="dlg" class="${warn ? 'warn' : ''}" role="dialog" aria-modal="true"><div class="dIcon">${warn ? '!' : '?'}</div><h3>${esc(title)}</h3>` +
      (text ? `<div class="dBody">${esc(text)}</div>` : '') +
      (list.length ? `<div class="dList">${list.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '') +
      `<div class="dBtns">${cancel ? `<button class="btn" type="button" data-d="0">${esc(cancel)}</button>` : ''}<button class="btn primary" type="button" data-d="1">${esc(ok)}</button></div></div>`;
    const done = (r) => { document.removeEventListener('keydown', key, true); v.remove(); resolve(r); };
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(true); } };
    v.addEventListener('click', (e) => { const b = e.target.closest('[data-d]'); if (b) done(b.dataset.d === '1'); else if (e.target === v && cancel) done(false); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(v); v.querySelector('[data-d="1"]').focus();
  });

async function traduciIT(text) {
  const t = String(text || '').trim(); if (!t) return '';
  const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(t) + '&langpair=it|en');
  if (!r.ok) throw new Error('servizio di traduzione non raggiungibile');
  const j = await r.json();
  let out = j && j.responseData && j.responseData.translatedText;
  if (!out || Number(j.responseStatus) !== 200) throw new Error((j && j.responseDetails) || 'traduzione non disponibile');
  out = out.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').trim();
  return out.charAt(0).toUpperCase() + out.slice(1);
}
async function runTrad(btn, getSrc, setOut) {
  const src = String(getSrc() || '').trim(), old = btn ? btn.textContent : '';
  if (!src) { if (btn) { btn.textContent = 'Scrivi prima la descrizione'; setTimeout(() => { btn.textContent = old; }, 2000); } return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Traduco…'; }
  try { setOut(await traduciIT(src)); if (btn) btn.textContent = old; }
  catch (e) { if (btn) { btn.textContent = 'Non riuscito: riprova'; setTimeout(() => { btn.textContent = old; }, 2500); } }
  if (btn) btn.disabled = false;
}

function askCodifica(v) {
  return new Promise((resolve) => {
    const f = (k, l, val, ph = '') => `<label style="text-align:left;margin:8px 0 0">${l}${k === 'en' ? '<button type="button" class="btn trbtn" data-tr="1">Traduci dall\'italiano</button>' : ''}<input type="text" data-cf="${k}" value="${esc(val ?? '')}" placeholder="${esc(ph)}"></label>`;
    const ve = document.createElement('div'); ve.id = 'dlgVeil';
    ve.innerHTML = `<div id="dlg" role="dialog" aria-modal="true"><div class="dIcon">✉</div><h3>File per codifica nuovo articolo</h3>
      <div class="dBody">${esc(v.codice)} · controlla i dati che finiranno nel file per l'ufficio acquisti.</div>
      <div style="margin-top:6px">${f('en', 'Descrizione inglese', v.en)}${f('acq', 'Prezzo d\'acquisto (€) — netto, dopo sconti *', v.acq)}
      ${f('scorta', 'Scorta minima (pz) *', v.scorta)}${f('riordino', 'Lotto di riordino (pz) *', v.riordino)}${f('lmf', 'Lotto minimo fornitore (pz) *', v.lmf)}
      ${f('nota', 'Eventuale nota Pennetta', v.nota, 'vuoto = nessuna nota')}</div>
      <div class="err" id="cfErr" style="margin-top:8px;min-height:16px"></div>
      <div class="dBtns"><button class="btn" type="button" data-d="0">Annulla</button><button class="btn primary" type="button" data-d="1">Crea file</button></div></div>`;
    const done = (r) => { document.removeEventListener('keydown', key, true); ve.remove(); resolve(r); };
    const go = () => {
      const g = (k) => ve.querySelector(`[data-cf="${k}"]`).value.trim();
      const o = { en: g('en'), nota: g('nota'), acq: numTxt(g('acq')), scorta: numTxt(g('scorta')), riordino: numTxt(g('riordino')), lmf: numTxt(g('lmf')) };
      const mis = [['Prezzo d\'acquisto', o.acq, g('acq')], ['Scorta minima', o.scorta, g('scorta')], ['Lotto di riordino', o.riordino, g('riordino')], ['Lotto minimo fornitore', o.lmf, g('lmf')]].filter(x => x[2] === '').map(x => x[0]);
      if (mis.length) { ve.querySelector('#cfErr').textContent = 'Compila i campi obbligatori: ' + mis.join(', ') + '.'; return; }
      if ([o.acq, o.scorta, o.riordino, o.lmf].some(x => Number.isNaN(x))) { ve.querySelector('#cfErr').textContent = 'Controlla i numeri inseriti.'; return; }
      done(o);
    };
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(null); } else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.stopPropagation(); go(); } };
    const enI = ve.querySelector('[data-cf="en"]');
    ve.addEventListener('click', (e) => { const t = e.target.closest('[data-tr]'); if (t) { runTrad(t, () => v.desc, (x) => { enI.value = x; }); return; } const b = e.target.closest('[data-d]'); if (b) b.dataset.d === '1' ? go() : done(null); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(ve); ve.querySelector('[data-cf="scorta"]').focus();
    if (!enI.value.trim() && v.desc) runTrad(ve.querySelector('[data-tr]'), () => v.desc, (x) => { if (!enI.value.trim()) enI.value = x; });
  });
}
async function loadExcelJS() {

}

function beRead() {
  const ch = [], payload = {}; let err = '';
  document.querySelectorAll('[data-be-on]').forEach(cb => {
    if (!cb.checked) return;
    const k = cb.dataset.beOn, el = document.querySelector(`[data-be="${k}"]`), v = el.value.trim();
    if (BE_PCT.some(x => x[0] === k)) {
      const lab = BE_PCT.find(x => x[0] === k)[1];
      if (v === '') { payload[k] = k === 'ricarico_personalizzato' ? null : 0; ch.push(`${lab}: ${k === 'ricarico_personalizzato' ? 'ricarico standard' : '0'}`); return; }
      const num = Number(v.replace(',', '.'));
      if (!isFinite(num) || num < (k === 'variazione_prezzo' ? -100 : 0) || num > (k === 'variazione_prezzo' ? 1000 : 100)) { err = `Valore non valido in «${lab}».`; return; }
      payload[k] = Math.round(num * 1e4) / 1e6; ch.push(`${lab}: ${String(num).replace('.', ',')}%`);
    } else if (k === 'obsoleto') { payload.obsoleto = v === 'true'; ch.push(`Obsoleto: ${v === 'true' ? 'sì' : 'no'}`); }
  });
  const rd = (k) => { const on = document.querySelector(`[data-be-on="${k}"]`); return on && on.checked ? [...document.querySelectorAll(`[data-${k}]:checked`)].map(c => Number(c.dataset[k])) : []; };
  const serieAdd = rd('sadd'), serieDel = rd('sdel'), nm = (id) => (serieById(id) || {}).nome;
  if (serieAdd.length) ch.push(`Aggiungi alle serie: ${serieAdd.map(nm).join(', ')}`);
  if (serieDel.length) ch.push(`Togli dalle serie: ${serieDel.map(nm).join(', ')}`);
  const both = serieAdd.filter(id => serieDel.includes(id));
  if (both.length) err = `La serie «${nm(both[0])}» è sia in "Aggiungi" che in "Togli".`;
  [['sadd', serieAdd], ['sdel', serieDel]].forEach(([k, a]) => { const el = document.getElementById(k + 'Txt'); if (el) el.textContent = !a.length ? 'Seleziona serie…' : a.length <= 2 ? a.map(nm).join(', ') : `${a.length} serie selezionate`; });
  return { ch, payload, serieAdd, serieDel, err };
}

async function relLoadList() {
  try {
    const r = await sb.from('release').select('*').order('anno', { ascending: false }).order('numero', { ascending: false });
    if (r.error) throw r.error;
    rel.list = r.data || [];
    const cnt = await Promise.all(rel.list.map(x => sb.from('release_righe').select('id', { count: 'exact', head: true }).eq('release_id', x.id)));
    rel.list.forEach((x, i) => { x.n = cnt[i].count || 0; });
    rel.numero = Math.max(0, ...rel.list.filter(x => x.anno === rel.anno).map(x => x.numero)) + 1;
  } catch (e) { rel.err = 'Non riesco a leggere le release: ' + (e.message || e); }
}

function relSay(m, bad) { rel.msg = m; const el = document.getElementById('relMsg'); if (el) { el.style.color = bad ? '#c0392b' : 'var(--muted)'; el.textContent = m; } }
async function relCreate() {
  const numero = parseInt(rel.numero, 10), anno = parseInt(rel.anno, 10);
  if (!(numero > 0) || !(anno > 2000) || !rel.data) { rel.err = 'Compila numero, anno e data di entrata in vigore.'; return relRender(); }
  if (rel.list.some(x => x.anno === anno && x.numero === numero)) { rel.err = `La release ${numero}-${anno} esiste già.`; return relRender(); }
  const okk = await ask({ title: 'Creare la release ' + numero + '-' + anno + '?', text: 'Verranno fotografati i prezzi di vendita attuali di tutti gli articoli non obsoleti. In vigore dal ' + dIT(rel.data, '/') + '.', ok: 'Crea release' });
  if (!okk) return;
  rel.busy = true; rel.err = ''; rel.form = false; relRender();
  try {
    relSay('Leggo gli articoli…');
    const arts = await fetchAll(() => sb.from('v_articoli').select(RELCOLS).eq('obsoleto', false).order('codice'));
    const ls = await fetchAll(() => sb.from('articoli_sistemi').select('articolo_id,sistema_id').order('articolo_id').order('sistema_id'));
    const ss = await sb.from('sistemi').select('id,nome,gruppo'); if (ss.error) throw ss.error;
    const nm = {}; ss.data.filter(s => s.gruppo === 'sottofamiglia').forEach(s => { nm[s.id] = s.nome; });
    const by = {}; ls.forEach(l => { if (nm[l.sistema_id]) (by[l.articolo_id] = by[l.articolo_id] || []).push(nm[l.sistema_id]); });
    const u = await sb.auth.getUser();
    const r = await sb.from('release').insert({ anno, numero, data_entrata_in_vigore: rel.data, creato_da: u.data.user.id }).select().single();
    if (r.error) throw r.error;
    const rows = arts.map(a => ({ release_id: r.data.id, codice: a.codice, dati: { p: a.codice_padre, d: a.descrizione, f: a.finitura, fam: a.famiglia, hw: a.tipo_hardware, mat: a.materiale_base, um: a.unita_misura, lm: a.lotto_minimo_vendita, uc: a.unita_per_confezione, lb: a.lunghezza_barra, pv: a.prezzo_vendita, nt: a.note, col: a.colore, nav: a.codice_nav, s: (by[a.id] || []).sort() } }));
    for (let i = 0; i < rows.length; i += 300) {
      relSay(`Salvo la release… ${Math.min(i + 300, rows.length)} / ${rows.length}`);
      const w = await sb.from('release_righe').insert(rows.slice(i, i + 300));
      if (w.error) { await sb.from('release').delete().eq('id', r.data.id); throw w.error; }
    }
    await relLoadList(); rel.busy = false; relRender(); relSay('Release ' + numero + '-' + anno + ' creata con ' + rows.length + ' articoli.');
  } catch (e) { rel.busy = false; rel.err = 'Errore: ' + (e.message || e); await relLoadList(); relRender(); }
}
