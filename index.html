<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listini</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logos"><img class="logo" style="height:64px" alt="Gruppo Profilati" src="img/gruppo-profilati.png"><img class="logo" style="height:40px" alt="EKU" src="img/eku.png"></div>
  <h1>GESTIONE LISTINI ACQ-VEND</h1>
  <div class="auth">
    <form class="auth" id="loginForm">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required aria-label="Email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
      <button class="btn primary pill" id="loginBtn" type="submit">Accedi</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="auth hidden" id="userBox">
      <span class="who"><span id="whoEmail"></span><span class="role" id="whoRole"></span></span>
      <button class="btn" id="logoutBtn">Esci</button>
    </div>
  </div>
</header>

<div class="intro" id="intro">Accedi dall'alto a destra per consultare i listini.</div>

<section id="app" class="hidden">
  <main>
    <div class="filters">
      <div><label for="q">Cerca per codice, codice articolo fornitore o descrizione</label><input id="q" type="search" placeholder="codice, codice fornitore o descrizione: es. cerniera, EA-0442..."></div>
      <div style="display:flex;gap:8px"><button class="btn primary hidden" id="newArt">+ Nuovo articolo</button><button class="btn" id="reset">Azzera filtri</button></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="cObs"> Mostra anche gli obsoleti</label>
      <label><input type="checkbox" id="cNoPrice"> Solo articoli senza prezzo di acquisto</label>
    </div>
    <div id="seriePanel" class="hidden"></div>
    <div class="toolbar">
      <span id="count"></span>
      <button class="btn" id="prev">‹ Precedente</button>
      <button class="btn" id="next">Successiva ›</button>
    </div>
    <div class="tablewrap">
      <table id="tbl">
        <colgroup id="cols"></colgroup>
        <thead id="thead"></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hidden" id="empty">Nessun articolo trovato.</div>
    </div>
    <div class="pager">
      <span id="count2"></span>
      <button class="btn" id="prev2">‹ Precedente</button>
      <button class="btn" id="next2">Successiva ›</button>
    </div>
  </main>
</section>

<div id="veil" class="hidden"></div>
<aside id="drawer" class="hidden"><div id="drawerBody"></div></aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
