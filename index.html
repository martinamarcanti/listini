<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listini</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2430; --muted: #6b7686; --line: #e3e7ee;
    --grid: #aab3c0; --thead: #cfd5de; --accent: #1f5fbf; --accent-soft: #e8f0fc; --warn: #b4531a; --warn-soft: #fcefe3; --ok: #1d7a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #98a2b3; --line: #2c323c;
            --grid: #4b5565; --thead: #343b48; --accent: #6aa3f5; --accent-soft: #1f2a3d; --warn: #f0a46b; --warn-soft: #33261a; --ok: #62c28e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=password], input[type=search], select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .btn { padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
  #selBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; margin: 0 0 8px; border: 1px solid var(--accent); border-radius: 8px; background: var(--panel); }
  #selBar b { color: var(--accent); }
  .rc, .hc { width: 16px; height: 16px; margin: 0 8px 0 0; vertical-align: -3px; cursor: pointer; accent-color: var(--accent); }
  tr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .be { padding: 18px 22px; } .be h2 { margin: 0; }
  .be .row { display: grid; grid-template-columns: 24px 190px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .be .row input[type=text], .be .row select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .be .row input:disabled, .be .row select:disabled { opacity: .45; }
  .be .sum { margin: 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .err { color: #c0392b; margin-top: 12px; min-height: 18px; }
  .pill { margin: 0; }

  /* App */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .logos { display: flex; align-items: center; gap: 18px; justify-self: start; padding: 4px 0; }
  header .logo { height: 46px; width: auto; display: block; }
  @media (prefers-color-scheme: dark) { header .logo { filter: invert(1) hue-rotate(180deg); } }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .1em; text-align: center; }
  .auth { justify-self: end; display: flex; align-items: center; gap: 8px; position: relative; }
  .auth input { width: 170px; padding: 6px 9px; }
  .auth .btn { padding: 6px 12px; }
  .auth .err { position: absolute; right: 0; top: 100%; margin: 2px 0 0; min-height: 0; font-size: 12px; white-space: nowrap; }
  .who { color: var(--muted); font-size: 13px; }
  .role { background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
  main { padding: 16px 20px 40px; }
  .intro { padding: 60px 20px; text-align: center; color: var(--muted); }
  .filters { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 10px; }
  .checks { display: flex; gap: 16px; margin: 4px 0 12px; color: var(--muted); }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; cursor: pointer; }
  :root { --gi-h: #cfd5de; --gi-b: #f3f5f8; --ga-h: #f7941d; --ga-b: #fef3e2; --gv-h: #8cc63f; --gv-b: #eef6df; --gh-t: #1d2430; }
  @media (prefers-color-scheme: dark) { :root { --gi-h: #343b48; --gi-b: #20252d; --ga-h: #c8741a; --ga-b: #3a2a14; --gv-h: #5f8a28; --gv-b: #26331a; --gh-t: #fff; } }
  thead th.g-i { background: var(--gi-h); color: var(--text); } thead th.g-a { background: var(--ga-h); color: var(--gh-t); } thead th.g-v { background: var(--gv-h); color: var(--gh-t); }
  thead tr.frow th.g-i { background: var(--gi-b); } thead tr.frow th.g-a { background: var(--ga-b); } thead tr.frow th.g-v { background: var(--gv-b); }
  td.g-i { background: var(--gi-b); } td.g-a { background: var(--ga-b); } td.g-v { background: var(--gv-b); }
  .tablewrap { background: var(--panel); border: 1px solid var(--grid); border-radius: 6px; overflow: auto; max-height: calc(100vh - 290px); min-height: 260px; }
  #tbl { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  th, td { padding: 8px 12px; text-align: left; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--panel); }
  thead th { font-size: 12px; color: var(--text); font-weight: 700; background: var(--thead); position: sticky; top: 0; z-index: 3; user-select: none; }
  thead tr.frow th { top: var(--h1, 36px); background: var(--panel); font-weight: 400; padding: 4px 8px 6px; z-index: 3; box-shadow: 0 1px 0 var(--grid); }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; box-shadow: 2px 0 0 var(--grid); font-weight: 600; }
  thead th:first-child { z-index: 5; }
  th.sortable .lbl { cursor: pointer; }
  th .arrow { color: var(--accent); margin-left: 4px; }
  th .rs { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: col-resize; }
  th .rs:hover, th .rs.on { background: var(--accent); opacity: .35; }
  tr.frow input, tr.frow select { padding: 5px 7px; font-size: 13px; }
  .toolbar { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin: 0 0 8px; color: var(--muted); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--accent-soft); }
  tr.obs td { color: var(--muted); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin-left: 6px; }
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; color: var(--muted); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }

  /* Scheda articolo */
  #veil { position: fixed; inset: 0; background: rgba(15,20,30,.55); z-index: 40; }
  #drawer { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1100px, 96vw); max-height: 92vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--grid); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 0; }
  .mhead { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .mhead .tt { flex: 1; min-width: 0; }
  .mhead h2 { margin: 0; font-size: 20px; }
  .mhead .sub { color: var(--muted); margin-top: 2px; }
  .mnav { display: flex; gap: 6px; align-items: center; }
  .mnav .btn { padding: 6px 12px; font-size: 16px; line-height: 1; }
  .mnav .pos { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .mbody { padding: 16px 20px 22px; display: grid; gap: 16px; }
  .box { border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .box > h3 { margin: 0; padding: 7px 14px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
  .hbtn { background: rgba(255,255,255,.8); border: 1px solid rgba(0,0,0,.2); border-radius: 6px; padding: 2px 10px; font-size: 12px; cursor: pointer; text-transform: none; letter-spacing: 0; color: #1d2430; }
  .formgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }
  .two .formgrid { grid-template-columns: 1fr 1fr; }
  .f { margin: 0; display: block; } .f > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .box.acq .f > span, .box.ven .f > span { color: #5b6574; }
  .f.wide { grid-column: 1 / -1; } .f.ck { display: flex; align-items: center; gap: 8px; padding-top: 18px; }
  .f.ck > span { margin: 0; }
  .formact { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .box.acq .hint, .box.ven .hint { color: #5b6574; }
  @media (max-width: 860px) { .formgrid, .two .formgrid { grid-template-columns: 1fr; } }
  .box > .in { padding: 12px 14px 14px; }
  .box.ident > h3 { background: var(--thead); color: var(--text); }
  .box.acq { border-color: #f0993a; background: #fef3e2; }
  .box.acq > h3 { background: #f7941d; color: #1d2430; }
  .box.ven { border-color: #86b83a; background: #eef6df; }
  .box.ven > h3 { background: #8cc63f; color: #1d2430; }
  .box.acq, .box.ven { color: #1d2430; }
  .box.acq dt, .box.ven dt, .box.acq .who, .box.ven .who { color: #5b6574; }
  @media (prefers-color-scheme: dark) {
    .box.acq { background: #3a2a14; border-color: #b9701c; color: var(--text); } .box.acq > h3 { background: #c8741a; color: #fff; }
    .box.ven { background: #26331a; border-color: #5f8a28; color: var(--text); } .box.ven > h3 { background: #5f8a28; color: #fff; }
    .box.acq dt, .box.ven dt, .box.acq .who, .box.ven .who { color: var(--muted); }
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .identgrid { display: grid; grid-template-columns: 1fr 240px; gap: 18px; }
  .identcols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
  .imgbox { border: 2px dashed var(--grid); border-radius: 10px; min-height: 200px; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 10px; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .st { padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--muted); font-size: 12px; }
  .st.on { background: var(--accent); color: #fff; font-weight: 600; } .st.done { color: var(--accent); }
  .wizfoot { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 4px; }
  .prev { margin-top: 14px; padding: 12px 14px; border: 1px solid #86b83a; background: #eef6df; color: #1d2430; border-radius: 10px; }
  @media (prefers-color-scheme: dark) { .prev { background: #26331a; border-color: #5f8a28; color: var(--text); } }
  .prev .big { margin-bottom: 4px; }
  details.adv { margin-top: 12px; } details.adv summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-bottom: 8px; }
  .imgcol { display: flex; flex-direction: column; gap: 8px; }
  .imgbox.has { border-style: solid; padding: 6px; }
  .imgbox img { max-width: 100%; max-height: 230px; object-fit: contain; border-radius: 6px; }
  .imgact { display: flex; gap: 6px; flex-wrap: wrap; } .imgact .btn { padding: 5px 10px; font-size: 12px; }
  .mini { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
  .box.acq .mini, .box.ven .mini { color: #5b6574; }
  .big { font-size: 22px; font-weight: 700; }
  @media (max-width: 860px) { .two, .identgrid, .identcols { grid-template-columns: 1fr; } }
  .sec { margin-top: 18px; }
  .sec h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  .editbox { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .editbox h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
  .editbox label.ck { display: inline-flex; align-items: center; gap: 6px; margin: 3px 14px 3px 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0 0 0 8px; font-size: 12px; }
  .tag { display: inline-block; border: 1px solid rgba(0,0,0,.07); background: #ccc; color: #1d2430; padding: 1px 9px; border-radius: 999px; font-size: 12px; line-height: 1.4; margin-right: 4px; vertical-align: middle; white-space: nowrap; }
  .tag.pick { cursor: pointer; opacity: .5; user-select: none; }
  .tag.pick.sel { opacity: 1; box-shadow: 0 0 0 2px var(--text); }
  th { position: relative; }
  thead th { padding-right: 26px; }
  th .fb { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; line-height: 16px; padding: 0; text-align: center; font-size: 11px; border: 1px solid rgba(0,0,0,.35); border-radius: 3px; background: #fff; color: #333; cursor: pointer; }
  th .fb:hover { background: #e8eef7; }
  th .fb.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #fpop { position: fixed; z-index: 40; width: 270px; max-width: calc(100vw - 16px); padding: 10px; background: var(--panel); color: var(--text); border: 1px solid var(--grid); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 13px; }
  #fpop .srt { display: flex; gap: 6px; margin-bottom: 8px; } #fpop .srt button { flex: 1; font-size: 12px; padding: 4px 6px; }
  #fpop input[type=search], #fpop input[type=number], #fpop input[type=text] { width: 100%; padding: 5px 7px; font-size: 13px; margin-bottom: 6px; }
  #fpop .lst { max-height: 260px; overflow: auto; border: 1px solid var(--grid); border-radius: 4px; padding: 4px 6px; margin-bottom: 8px; }
  #fpop .lst label { display: flex; align-items: center; gap: 7px; margin: 0; padding: 2px 0; font-size: 13px; cursor: pointer; font-weight: 400; }
  #fpop .lst label input { width: auto; margin: 0; }
  #fpop .lst .n { margin-left: auto; color: var(--muted); font-size: 11px; }
  #fpop .btns { display: flex; gap: 6px; justify-content: flex-end; } #fpop .btns .clr { margin-right: auto; }
  #fpop .rg { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; margin-bottom: 8px; }
  #fpop .rg input { margin: 0 !important; }
  #seriePanel { position: fixed; z-index: 30; width: 420px; max-width: calc(100vw - 16px); max-height: 60vh; overflow: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--grid); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  #seriePanel .ph { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  #seriePanel .tags { display: flex; flex-wrap: wrap; gap: 8px 4px; }
  #serieToggle { width: 100%; padding: 5px 7px; font-size: 13px; text-align: left; font-weight: 400; }
  .bk h2 { margin: 0 0 6px; font-size: 18px; } .bk .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .bk table { width: 100%; border-collapse: collapse; margin: 10px 0; } .bk td, .bk th { padding: 5px 8px; border-bottom: 1px solid var(--grid); font-size: 13px; text-align: left; white-space: normal; border-right: none; background: transparent; position: static; }
  .bk td img { width: 48px; height: 48px; object-fit: contain; background: #fff; border: 1px solid var(--grid); border-radius: 4px; display: block; }
  .bk .no { color: #c0392b; } .bk .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 8px 0; } .bk .scroll { max-height: 55vh; overflow: auto; border: 1px solid var(--grid); border-radius: 6px; padding: 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 999px; font-size: 12px; }
  .hist th, .hist td { background: transparent !important; box-shadow: none !important; position: static !important; font-weight: 400; border-right: none; color: inherit; }
  .hist th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--grid); }
  .hist { border-collapse: collapse; }
  .hist td, .hist th { padding: 5px 8px; font-size: 13px; }
  @media (max-width: 760px) { dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
</style>
</head>

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Email o password non corretti.'; return; }
  $('password').value = '';
  start();
});
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('loginForm').classList.remove('hidden'); $('userBox').classList.add('hidden'); $('intro').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  $('loginForm').classList.add('hidden'); $('userBox').classList.remove('hidden'); $('intro').classList.add('hidden'); $('app').classList.remove('hidden');
  $('whoEmail').textContent = session.user.email;
  const { data: prof } = await sb.from('profili').select('ruolo').eq('user_id', session.user.id).maybeSingle();

  $('newArt').classList.toggle('hidden', !isAdmin); $('bulkImg').classList.toggle('hidden', !isAdmin);
  $('whoRole').textContent = isAdmin ? 'Admin' : 'Sola lettura';
  await loadLists();
  await load();
}

function applyFilters(q) {
  const text = $('q').value.trim().replace(/[,()%*\\]/g, ' ');
  if (text) q = q.or(`codice.ilike.%${text}%,descrizione.ilike.%${text}%,codice_articolo_fornitore.ilike.%${text}%`);
  ['codice', 'descrizione', 'codice_articolo_fornitore'].forEach(k => { const v = (colF[k] || '').trim().replace(/[%*]/g, ''); if (v) q = q.ilike(k, `%${v}%`); });
  const qt = (v) => '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  Object.keys(colSel).forEach(k => {
    const keys = [...colSel[k]], hasNull = keys.includes(''), vals = keys.filter(x => x !== '');
    if (!vals.length) q = q.is(k, null);
    else if (!hasNull) q = q.in(k, vals);
    else q = q.or(`${k}.in.(${vals.map(qt).join(',')}),${k}.is.null`);
  });
  Object.keys(colR).forEach(k => { const r = colR[k]; if (r.min != null) q = q.gte(k, r.min); if (r.max != null) q = q.lte(k, r.max); });
  if (serieSel.size) {
    const ids = [...serieSel].filter(x => x > 0), none = serieSel.has(0);
    if (ids.length && none) q = q.or(`serie_ids.ov.{${ids.join(',')}},serie_ids.eq.{}`);
    else if (ids.length) q = q.overlaps('serie_ids', ids);
    else q = q.eq('serie_ids', '{}');
  }
  if (obsMode === 'no') q = q.eq('obsoleto', false); else if (obsMode === 'si') q = q.eq('obsoleto', true);
  if ($('cNoPrice').checked) q = q.is('prezzo_acquisto', null);
  return q;
}

    .order(sort.k, { ascending: sort.asc, nullsFirst: false });
  if (sort.k !== 'codice') q = q.order('codice');
  q = applyFilters(q);
  q = q.range(page * PAGE, page * PAGE + PAGE - 1);
  const { data, count, error } = await q;
  if (my !== seq) return;
  if (error) { $('rows').innerHTML = ''; $('empty').textContent = 'Errore nel caricamento: ' + error.message; $('empty').classList.remove('hidden'); return; }
  total = count || 0;
  listIds = (data || []).map(r => r.id);

function beRead() {

      const num = Number(v.replace(',', '.'));
      if (!isFinite(num) || num < (k === 'variazione_prezzo' ? -100 : 0) || num > (k === 'variazione_prezzo' ? 1000 : 100)) { err = `Valore non valido in «${lab}».`; return; }

        if (['sconto_base', 'sconto_extra1', 'sconto_extra2', 'sconto_extra3', 'variazione_prezzo', 'ricarico_personalizzato'].some(k => k in r.payload)) {

async function resizeImage(file, max = 900) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

async function saveSection(sec) {
  const box = document.querySelector(`.box[data-sec="${sec}"]`), a = curArt, payload = {};
  const err = (m) => { $('saveErr').textContent = m; };
  let bad = null;
  box.querySelectorAll('[data-k]').forEach(el => {
    if (bad) return;
    const k = el.dataset.k, t = el.dataset.t; let v;
    if (t === 'bool') v = el.checked;
    else {
      let rv = el.value;
      if (el.dataset.combo && rv === '__new__') rv = box.querySelector(`[data-newfor="${k}"]`)?.value || '';
      const raw = rv.trim();
      if (raw === '') v = t === 'pct0' ? 0 : null;
      else if (t === 'text') v = raw;
      else if (t === 'id') v = Number(raw);
      else {
        const n = Number(raw.replace(',', '.'));
        if (!isFinite(n)) { bad = 'Valore non valido: ' + (el.closest('label')?.querySelector('span')?.textContent || k); return; }
        v = (t === 'pct' || t === 'pct0') ? Math.round(n * 1e4) / 1e6 : n;
      }
    }
    const old = a[k];
    const same = v === null ? (old === null || old === undefined || old === '') : t === 'text' ? String(old ?? '') === v : t === 'bool' ? !!old === v : Number(old) === v;
    if (!same) payload[k] = v;

      const ins = await sb.from('tipi_hardware').insert({ nome }).select('id,nome').single();
      if (ins.error) { $('hwErr').textContent = 'Errore: ' + ins.error.message; return; }
      t = ins.data; lookups.tipi.push(t); lookups.tipi.sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
    }
    const sel = $('drawer').querySelector('select[data-k="tipo_hardware_id"]');
    sel.innerHTML = '<option value=""></option>' + lookups.tipi.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('');
    sel.value = String(t.id); sel.dispatchEvent(new Event('input', { bubbles: true }));
    $('hwBox').remove(); return;
  }
  if (e.target.closest('[data-supcancel]')) { $('supBox')?.remove(); return; }
  if (e.target.closest('[data-supsave]')) {
    const nome = $('supNome').value.trim().replace(/\s+/g, ' ').toUpperCase(), cod = $('supCod').value.trim();
    const err = (m) => { $('supErr').textContent = m; };
    if (!nome) return err('Scrivi il nome del fornitore.');
    let f = lookups.fornitori.find(x => x.nome.toUpperCase() === nome);
    if (!f) {
      const ins = await sb.from('fornitori').insert({ nome, codice: cod || null, attivo: true }).select('id,nome,codice').single();
      if (ins.error) return err('Errore: ' + ins.error.message);
      f = ins.data; lookups.fornitori.push(f); lookups.fornitori.sort((a, b) => a.nome.localeCompare(b.nome, 'it'));
      fornitori = lookups.fornitori.map(x => x.nome); buildHead();
    } else if (cod && !f.codice) { await sb.from('fornitori').update({ codice: cod }).eq('id', f.id); f.codice = cod; }
    const sel = $('drawer').querySelector('select[data-k="fornitore_id"]');
    sel.innerHTML = '<option value=""></option>' + lookups.fornitori.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('');
    sel.value = String(f.id); sel.dispatchEvent(new Event('input', { bubbles: true }));
    const c = $('drawer').querySelector('[data-k="codice_fornitore"]');
    if (c && (f.codice || cod)) { c.value = f.codice || cod; c.dispatchEvent(new Event('input', { bubbles: true })); }
    $('supBox')?.remove();
  }
});

/* ---------- caricamento immagini in blocco ---------- */
let bulk = null;
function openBulk() { bulk = { items: [], over: false, busy: false, msg: '' }; closeSerie(); $('veil').classList.remove('hidden'); $('drawer').classList.remove('hidden'); renderBulk(); }
function renderBulk() {
  const b = bulk, sel = b.items.filter(x => x.on && x.arts.length);
  const rows = b.items.map((x, i) => {
    const have = x.arts.filter(a => a.immagine).length;
    const codes = x.arts.slice(0, 6).map(a => esc(a.codice)).join(', ') + (x.arts.length > 6 ? ` … (+${x.arts.length - 6})` : '');
    return `<tr><td><input type="checkbox" data-bk-on="${i}" ${x.on ? 'checked' : ''} ${x.arts.length && !b.busy ? '' : 'disabled'}></td><td><img src="${x.url}" alt=""></td><td>${esc(x.file.name)}</td>` +
      (x.arts.length ? `<td><b>${x.arts.length}</b> ${x.arts.length === 1 ? 'articolo' : 'articoli'}: ${codes}${have ? `<br><span style="color:var(--muted)">${have} già con immagine</span>` : ''}</td>` : `<td class="no">nessun articolo con questo codice</td>`) + '</tr>';
  }).join('');
  const n = sel.reduce((t, x) => t + x.arts.filter(a => b.over || !a.immagine).length, 0);
  $('drawerBody').innerHTML = `<div class="bk" style="padding:18px 22px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Carica immagini in blocco</h2><button class="btn" id="closeDrawer" type="button">Chiudi ✕</button></div>
    <p class="hint">Scegli più file insieme: il nome di ogni file deve essere il codice (es. <b>600-2910.jpg</b>). L'immagine viene collegata a quell'articolo e a tutte le sue finiture, cioè ai codici che iniziano con lo stesso codice (es. 600-1058R → 600-1058RAR, 600-1058RBI…).</p>
    <div class="bar"><input type="file" id="bkFile" multiple accept="image/*" hidden><button class="btn primary" type="button" data-bk="pick" ${b.busy ? 'disabled' : ''}>Scegli immagini…</button>
    <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:400"><input type="checkbox" id="bkOver" ${b.over ? 'checked' : ''} ${b.busy ? 'disabled' : ''}> Sostituisci le immagini già presenti</label></div>
    ${b.items.length ? `<div class="scroll"><table><tbody>${rows}</tbody></table></div>
    <div class="bar"><button class="btn primary" type="button" data-bk="go" ${b.busy || !n ? 'disabled' : ''}>Collega le immagini a ${n} ${n === 1 ? 'articolo' : 'articoli'}</button><span id="bkMsg" style="color:var(--muted)">${esc(b.msg)}</span></div>` : `<div id="bkMsg" style="color:var(--muted)">${esc(b.msg)}</div>`}</div>`;
}
async function bulkPick(files) {
  const b = bulk; b.items = []; b.msg = 'Cerco gli articoli…'; renderBulk();
  const list = [...files].sort((x, y) => x.name.localeCompare(y.name));
  for (const f of list) {
    let code = f.name.replace(/\.[^.]+$/, '').replace(/\s*\(\d+\)$/, '').trim();
    const find = async (cd) => (await sb.from('articoli').select('id,codice,immagine').ilike('codice', cd.replace(/[\\%_]/g, m => '\\' + m) + '%').order('codice').limit(300)).data;
    let data = await find(code);
    if (!(data || []).length && code.includes('_')) { const alt = code.replace(/_/g, '/'); const d2 = await find(alt); if ((d2 || []).length) { code = alt; data = d2; } }
    const up = code.toUpperCase();
    const arts = (data || []).filter(a => { const c = a.codice.toUpperCase(); if (c === up) return true; const rest = c.slice(up.length); return !(/\d$/.test(up) && /^[\d.]/.test(rest)); });
    b.items.push({ file: f, code, url: URL.createObjectURL(f), arts, on: arts.length > 0 });
  }
  b.msg = ''; renderBulk();
}
async function bulkGo() {
  const b = bulk; b.busy = true; renderBulk();
  let ok = 0, arts = 0, errs = [];
  const todo = b.items.filter(x => x.on && x.arts.length);
  for (let i = 0; i < todo.length; i++) {
    const x = todo[i], list = x.arts.filter(a => b.over || !a.immagine);
    if (!list.length) continue;
    const m = $('bkMsg'); if (m) m.textContent = `Carico ${i + 1} di ${todo.length}: ${x.file.name}…`;
    let blob; try { blob = await resizeImage(x.file); } catch (e) { errs.push(x.file.name + ' (file non leggibile)'); continue; }
    let fine = 0;
    for (let k = 0; k < list.length; k += 4) {
      await Promise.all(list.slice(k, k + 4).map(async a => {
        const path = `${a.id}.jpg`;
        const up = await sb.storage.from(BUCKET).upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
        if (up.error) { errs.push(`${a.codice}: ${up.error.message}`); return; }
        const u = await sb.from('articoli').update({ immagine: path }).eq('id', a.id);
        if (u.error) { errs.push(`${a.codice}: ${u.error.message}`); return; }
        a.immagine = path; fine++;
      }));
    }
    if (fine) { ok++; arts += fine; }
  }
  b.busy = false; b.items = b.items.filter(x => x.arts.length === 0 || x.arts.some(a => !a.immagine));
  b.msg = `Fatto: ${ok} immagini collegate a ${arts} articoli.` + (errs.length ? ` Errori (${errs.length}): ${errs.slice(0, 5).join('; ')}` : '');
  b.items = []; renderBulk();
}
$('bulkImg').addEventListener('click', openBulk);
$('drawer').addEventListener('click', (e) => {
  if (!bulk) return;
  const k = e.target.closest('[data-bk]'); if (k) { k.dataset.bk === 'pick' ? $('bkFile').click() : bulkGo(); }
  const on = e.target.closest('[data-bk-on]'); if (on) bulk.items[Number(on.dataset.bkOn)].on = on.checked;
  if (e.target.id === 'bkOver') { bulk.over = e.target.checked; renderBulk(); }
  if (on) renderBulk();
});
$('drawer').addEventListener('change', (e) => { if (bulk && e.target.id === 'bkFile' && e.target.files.length) bulkPick(e.target.files); });

function closeDrawer() {
  if (wiz && !confirm('Chiudere senza creare l\'articolo? I dati inseriti andranno persi.')) return;
  if (bulk && bulk.busy) return;
  wiz = null; bulk = null; $('veil').classList.add('hidden'); $('drawer').classList.add('hidden');
}
$('drawer').addEventListener('click', (e) => {
  if (e.target.closest('#closeDrawer')) closeDrawer();
  const n = e.target.closest('[data-nav]'); if (n) navArticle(Number(n.dataset.nav));
  const ed = e.target.closest('[data-edit]'); if (ed) startEdit(ed.dataset.edit);
  if (e.target.closest('[data-dup]')) startWizard(curArt);
  const sv = e.target.closest('[data-save]'); if (sv) saveSection(sv.dataset.save);
  if (e.target.closest('[data-cancel]')) { editing = null; renderModal(); }
  const im = e.target.closest('[data-img]'); if (im) { im.dataset.img === 'pick' ? $('imgFile').click() : removeImage(); }
});
$('veil').addEventListener('click', closeDrawer);
$('drawer').addEventListener('change', (e) => { if (e.target.id === 'imgFile' && e.target.files[0]) uploadImage(e.target.files[0]); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDrawer();
  if ($('drawer').classList.contains('hidden') || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
  if (editing || wiz) return;
  if (e.key === 'ArrowLeft') navArticle(-1);
  if (e.key === 'ArrowRight') navArticle(1);
});

start();
</script>
</body>
